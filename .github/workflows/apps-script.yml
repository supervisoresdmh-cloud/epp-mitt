name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'gas/**'
  workflow_dispatch:

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Misma versión que la local, para que el formato de ~/.clasprc.json coincida
      - name: Install clasp
        run: npm install -g @google/clasp@3.4.1

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          printf '%s' "$CLASPRC_JSON" > ~/.clasprc.json
          chmod 600 ~/.clasprc.json

      - name: Push code
        working-directory: gas
        run: clasp push --force

      # Crea una versión nueva y la asigna a la implementación existente (la URL /exec no cambia)
      - name: Update existing deployment
        working-directory: gas
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
        run: clasp update-deployment "$DEPLOYMENT_ID" --description "GitHub ${GITHUB_SHA::7}"

      - name: Remove credentials
        if: always()
        run: rm -f ~/.clasprc.json
